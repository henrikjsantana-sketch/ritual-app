<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritual — Build Routines That Stick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&family=Poppins:wght@400;600;700&family=Comic+Neue:wght@400;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#111010; --ink:#F3EFE6; --soft:#9C968A; --line:#2B2823;
    --accent:#C9A227; --accent-dark:#A6841C; --card:#181614; --card-alpha:rgba(24,22,20,.92);
    --font-body:'Inter',-apple-system,sans-serif;
    --font-display:'Playfair Display',Georgia,serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);min-height:100vh;background-size:cover;background-position:center;background-attachment:fixed;transition:background-color .3s;}
  h1,h2,h3{font-family:var(--font-display);color:var(--ink);letter-spacing:.3px;}
  .tagline{font-style:italic;}
  .wrap{max-width:640px;margin:0 auto;padding:40px 20px 80px;}
  h1{font-size:36px;font-weight:800;margin:0 0 4px;letter-spacing:.5px;}
  .tagline{color:var(--soft);margin:0 0 32px;font-size:15px;}
  .card{background:var(--card-alpha);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:6px;padding:26px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  label{display:block;font-size:12px;color:var(--soft);margin-bottom:4px;margin-top:14px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
  input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:4px;font-size:15px;background:#0C0B0A;color:var(--ink);font-family:inherit;}
  input[type=color]{width:48px;height:40px;border:1px solid var(--line);border-radius:4px;padding:2px;background:#fff;}
  select{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:4px;font-size:15px;background:#0C0B0A;color:var(--ink);font-family:inherit;}
  button{cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--accent);color:#15130F;border:none;border-radius:4px;padding:13px 18px;font-size:14px;font-weight:700;width:100%;margin-top:18px;text-transform:uppercase;letter-spacing:1px;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-link{background:none;border:none;color:var(--accent);font-size:14px;padding:0;margin-top:14px;text-decoration:underline;}
  .error{color:#D9756B;font-size:14px;margin-top:10px;}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px;}
  .tab{flex-shrink:0;padding:9px 16px;border-radius:4px;border:1px solid var(--line);background:var(--card-alpha);font-size:13px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;}
  .tab.active{background:var(--accent);color:#15130F;border-color:var(--accent);}
  .routine-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .streak{background:var(--bg);color:var(--accent);font-size:13px;padding:4px 12px;border-radius:4px;font-weight:700;border:1px solid var(--line);}
  .item-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;border-radius:2px;}
  .item-row span{flex:1;font-size:15px;}
  .item-row.done span{color:var(--soft);text-decoration:line-through;}
  .rm{background:none;border:none;color:var(--soft);font-size:18px;}
  .add-item{display:flex;gap:8px;margin-top:12px;}
  .add-item input{flex:1;}
  .add-item button{background:var(--accent);color:#15130F;border:none;border-radius:4px;padding:9px 16px;font-weight:700;}
  .sub-list{margin-top:10px;}
  .sub-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);color:var(--ink);border-radius:4px;padding:6px 14px;font-size:13px;font-weight:600;margin:4px 6px 0 0;border:1px solid var(--line);}
  .new-sub{display:flex;gap:8px;margin-top:14px;}
  .new-sub input{flex:1;}
  .new-sub button{background:var(--accent-dark);color:#15130F;border:none;border-radius:4px;padding:9px 16px;font-weight:700;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .icon-btn{background:var(--card-alpha);border:1px solid var(--line);border-radius:4px;padding:8px 12px;font-size:16px;}
  .signout{background:none;border:none;color:var(--soft);font-size:13px;text-decoration:underline;}
  .hidden{display:none;}
  .muted{color:var(--soft);font-size:14px;}
  .topbar-actions{display:flex;gap:10px;align-items:center;}
  .seg{display:flex;gap:6px;margin-top:10px;}
  .seg button{flex:1;padding:8px;border-radius:4px;border:1px solid var(--line);background:var(--bg);color:var(--soft);font-weight:600;font-size:13px;}
  .seg button.active{background:var(--accent);color:#15130F;border-color:var(--accent);}
  .nav-main{display:flex;gap:24px;margin-bottom:24px;border-bottom:2px solid var(--line);padding-bottom:10px;flex-wrap:wrap;}
  .nav-main button{background:none;border:none;color:var(--soft);font-weight:700;font-size:13px;padding:4px 2px;border-bottom:3px solid transparent;text-transform:uppercase;letter-spacing:1px;}
  .nav-main button.active{color:var(--accent);border-bottom-color:var(--accent);}
  .logo-wrap{display:flex;align-items:center;gap:12px;}
  .logo-mark circle{stroke:var(--accent);}
  .logo-mark path,.logo-mark text{fill:var(--accent);}
  .hamburger{background:none;border:1px solid var(--line);border-radius:4px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;}
  .hamburger span{display:block;width:18px;height:2px;background:var(--ink);}
  .nav-dropdown{position:relative;}
  .nav-main{position:absolute;top:calc(100% + 8px);right:0;z-index:10;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px;min-width:180px;box-shadow:0 12px 32px rgba(0,0,0,.5);border-bottom:1px solid var(--line);}
  .nav-main button{padding:10px 12px;border-bottom:none !important;text-align:left;width:100%;border-radius:4px;}
  .nav-main button.active{background:rgba(201,162,39,.12);}
  .nav-main button:hover{background:rgba(255,255,255,.04);}
  .lb-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{font-weight:700;color:var(--soft);width:32px;}
  .lb-name{flex:1;font-weight:600;}
  .lb-xp{color:var(--accent);font-weight:700;}
  .add-friend{display:flex;gap:8px;margin-top:10px;}
  .add-friend input{flex:1;}
  .pending-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
  .add-item input[type=number]{width:64px;flex:none;text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <div id="authView">
    <div class="logo-wrap">
      <svg class="logo-mark" viewBox="0 0 40 40" width="34" height="34" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="17" fill="none" stroke-width="2"/>
        <text x="20" y="27" font-family="Playfair Display, serif" font-size="19" font-weight="700" text-anchor="middle">R</text>
      </svg>
      <h1 style="margin:0;">Ritual</h1>
    </div>
    <p class="tagline">Small routines, done daily, become who you are.</p>
    <div class="card">
      <h2 id="authTitle" style="margin:0;font-size:18px;">Log in</h2>
      <label>Email</label>
      <input id="email" type="email" autocomplete="email">
      <label>Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <button class="btn-primary" id="authSubmit">Log in</button>
      <div class="error hidden" id="authError"></div>
      <button class="btn-link" id="authToggle">Need an account? Sign up</button>
      <button class="btn-link" id="forgotBtn" style="margin-left:16px;">Forgot password?</button>
    </div>
  </div>

  <div id="resetView" class="hidden">
    <h1>Set a new password</h1>
    <p class="tagline">Choose a new password for your account.</p>
    <div class="card">
      <label>New password</label>
      <input id="newPassword" type="password" autocomplete="new-password">
      <button class="btn-primary" id="resetSubmit">Save new password</button>
      <div class="error hidden" id="resetError"></div>
    </div>
  </div>

  <div id="appView" class="hidden">
    <div class="topbar">
      <div class="logo-wrap">
        <svg class="logo-mark" viewBox="0 0 40 40" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="17" fill="none" stroke-width="2"/>
          <text x="20" y="27" font-family="Playfair Display, serif" font-size="19" font-weight="700" text-anchor="middle">R</text>
        </svg>
        <div>
          <h1 style="margin-bottom:0;font-size:24px;">Ritual</h1>
          <span class="muted" id="whoami"></span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="customizeBtn" title="Customize look">🎨</button>
        <button class="signout" id="signout">Log out</button>
        <div class="nav-dropdown">
          <button class="hamburger" id="navToggle" title="Menu"><span></span><span></span><span></span></button>
          <div class="nav-main hidden" id="mainNav">
            <button data-view="home" class="active">Home</button>
            <button data-view="routines">Routines</button>
            <button data-view="leaderboard">Leaderboard</button>
            <button data-view="about">About</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card hidden" id="customizePanel">
      <h3 style="margin:0;font-size:16px;">Customize your look</h3>
      <label>Background</label>
      <div class="seg" id="bgTypeSeg">
        <button data-type="color" class="active">Color</button>
        <button data-type="image">Image</button>
      </div>
      <div id="bgColorRow" style="margin-top:10px;">
        <input type="color" id="bgColorInput" value="#F2E9DA">
      </div>
      <div id="bgImageRow" class="hidden" style="margin-top:10px;">
        <input type="text" id="bgImageInput" placeholder="Paste an image URL…">
      </div>
      <label>Accent color</label>
      <input type="color" id="accentInput" value="#B5652F">
      <label>Text color</label>
      <input type="color" id="textColorInput" value="#3A3226">
      <label>Font</label>
      <select id="fontInput">
        <option value="Nunito">Nunito (rounded)</option>
        <option value="Quicksand">Quicksand (rounded)</option>
        <option value="Poppins">Poppins (clean)</option>
        <option value="Comic Neue">Comic Neue (playful)</option>
        <option value="Merriweather">Merriweather (serif)</option>
      </select>
      <button class="btn-primary" id="saveCustomize">Save look</button>
    </div>

    <div class="card hidden" id="usernameSetup">
      <h3 style="margin:0;font-size:16px;">Pick a username</h3>
      <p class="muted" style="margin-top:4px;">Shown on leaderboards and to friends — keep it unique.</p>
      <input type="text" id="usernameInput" placeholder="e.g. alex_runs">
      <button class="btn-primary" id="usernameSubmit">Save username</button>
      <div class="error hidden" id="usernameError"></div>
    </div>

    <div id="homeView"></div>

    <div id="routinesView" class="hidden">
      <div class="tabs" id="tabs"></div>
      <div id="routineArea"></div>
    </div>

    <div id="leaderboardView" class="hidden"></div>

    <div id="aboutView" class="hidden"></div>
  </div>

</div>

<script>
const SUPABASE_URL = "https://vpeigrziwpxmvszkzcrj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Cw3J1jQAidORRclfLQttrg_DtA_SfCX";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATS = [
  {key:"morning", label:"Morning", items:["Make the bed","Drink a glass of water","Stretch for 5 minutes","Eat breakfast"]},
  {key:"night", label:"Night", items:["Lay out tomorrow's clothes","No screens 30 min before bed","Brush teeth","Read a few pages"]},
  {key:"after_school", label:"After School", items:["Snack + water","Homework block","Free time"]},
  {key:"after_work", label:"After Work", items:["Change out of work clothes","10-min walk","Plan tomorrow's top task"]},
];

let session = null;
let routinesList = [];
let activeRoutineId = null;
let signupMode = false;

const $ = id => document.getElementById(id);

$('authToggle').onclick = () => {
  signupMode = !signupMode;
  $('authTitle').textContent = signupMode ? "Sign up" : "Log in";
  $('authSubmit').textContent = signupMode ? "Sign up" : "Log in";
  $('authToggle').textContent = signupMode ? "Already have an account? Log in" : "Need an account? Sign up";
};

$('authSubmit').onclick = async () => {
  $('authError').classList.add('hidden');
  const email = $('email').value.trim();
  const password = $('password').value;
  if(!email || !password){ showAuthError("Enter an email and password."); return; }
  const fn = signupMode ? sb.auth.signUp({email, password}) : sb.auth.signInWithPassword({email, password});
  const {data, error} = await fn;
  if(error){ showAuthError(error.message); return; }
  if(signupMode && !data.session){
    showAuthError("Check your email to confirm your account, then log in.");
    return;
  }
  session = data.session;
  boot();
};

function showAuthError(msg){
  $('authError').textContent = msg;
  $('authError').classList.remove('hidden');
}

$('forgotBtn').onclick = async () => {
  const email = $('email').value.trim();
  if(!email){ showAuthError("Type your email above first, then click \"Forgot password?\" again."); return; }
  $('authError').classList.add('hidden');
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: window.location.origin});
  if(error){ showAuthError(error.message); return; }
  showAuthError("Check your email for a link to reset your password.");
  $('authError').style.color = 'var(--accent-dark, #96501F)';
};

$('resetSubmit').onclick = async () => {
  $('resetError').classList.add('hidden');
  const newPass = $('newPassword').value;
  if(!newPass || newPass.length < 6){ 
    $('resetError').textContent = "Password must be at least 6 characters.";
    $('resetError').classList.remove('hidden');
    return;
  }
  const {error} = await sb.auth.updateUser({password: newPass});
  if(error){
    $('resetError').textContent = error.message;
    $('resetError').classList.remove('hidden');
    return;
  }
  const {data} = await sb.auth.getSession();
  session = data.session;
  $('resetView').classList.add('hidden');
  boot();
};

sb.auth.onAuthStateChange((event, sessionData) => {
  if(event === 'PASSWORD_RECOVERY'){
    $('authView').classList.add('hidden');
    $('appView').classList.add('hidden');
    $('resetView').classList.remove('hidden');
  } else if((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && sessionData && !session){
    session = sessionData;
    boot();
  }
});

$('signout').onclick = async () => {
  await sb.auth.signOut();
  session = null;
  myProfile = null;
  $('usernameSetup').classList.add('hidden');
  $('appView').classList.add('hidden');
  $('authView').classList.remove('hidden');
};

let currentSettings = {bg_type:'color', bg_value:'#F2E9DA', accent:'#B5652F', text_color:'#3A3226', font:'Nunito'};

const TITLES = [
  {min:0, title:"Newcomer", icon:"🌱"},
  {min:50, title:"Rising", icon:"🔥"},
  {min:150, title:"Committed", icon:"⭐"},
  {min:400, title:"Disciplined", icon:"💎"},
  {min:1000, title:"Master", icon:"🏆"},
  {min:2500, title:"Legend", icon:"👑"},
];
function getTitleFor(xp){
  let t = TITLES[0];
  for(const x of TITLES) if(xp >= x.min) t = x;
  return t;
}
let myProfile = null;

async function boot(){
  $('authView').classList.add('hidden');
  $('appView').classList.remove('hidden');
  await loadSettings();
  setupCustomizeUI();
  const ready = await ensureProfile();
  if(!ready) return;
  finishBoot();
}

function finishBoot(){
  renderProfileBadge();
  setupNav();
  showView('home');
  loadRoutinesList().then(()=>{
    renderTabs();
    if(activeRoutineId) loadRoutine(activeRoutineId);
  });
}

async function ensureProfile(){
  const {data} = await sb.from('profiles').select('*').eq('user_id', session.user.id).maybeSingle();
  if(data){ myProfile = data; return true; }

  $('usernameSetup').classList.remove('hidden');
  $('usernameSubmit').onclick = async () => {
    $('usernameError').classList.add('hidden');
    const uname = $('usernameInput').value.trim();
    if(!uname || uname.length < 3){
      $('usernameError').textContent = "Username must be at least 3 characters.";
      $('usernameError').classList.remove('hidden');
      return;
    }
    const {data: created, error} = await sb.from('profiles')
      .insert({user_id: session.user.id, username: uname, total_xp:0}).select().single();
    if(error){
      $('usernameError').textContent = error.message.toLowerCase().includes('duplicate') ? "That username is taken." : error.message;
      $('usernameError').classList.remove('hidden');
      return;
    }
    myProfile = created;
    $('usernameSetup').classList.add('hidden');
    finishBoot();
  };
  return false;
}

function renderProfileBadge(){
  const t = getTitleFor(myProfile.total_xp);
  $('whoami').innerHTML = `${t.icon} <strong>${escapeHtml(myProfile.username)}</strong> · ${t.title} · ${myProfile.total_xp} XP`;
}

async function adjustXp(delta){
  if(!myProfile) return;
  myProfile.total_xp = Math.max(0, myProfile.total_xp + delta);
  await sb.from('profiles').update({total_xp: myProfile.total_xp}).eq('user_id', session.user.id);
  renderProfileBadge();
}

function setupNav(){
  $('navToggle').onclick = () => $('mainNav').classList.toggle('hidden');
  document.querySelectorAll('#mainNav button').forEach(b=>{
    b.onclick = () => { showView(b.dataset.view); $('mainNav').classList.add('hidden'); };
  });
  document.addEventListener('click', (e)=>{
    if(!$('mainNav').classList.contains('hidden') && !e.target.closest('.nav-dropdown')){
      $('mainNav').classList.add('hidden');
    }
  });
}

function showView(view){
  ['home','routines','leaderboard','about'].forEach(v=>{
    $(v+'View').classList.toggle('hidden', v!==view);
  });
  document.querySelectorAll('#mainNav button').forEach(b=>b.classList.toggle('active', b.dataset.view===view));
  if(view==='home') renderHome();
  if(view==='leaderboard') loadLeaderboard('global');
  if(view==='about') renderAbout();
}

function renderHome(){
  const t = getTitleFor(myProfile.total_xp);
  $('homeView').innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 6px;">Welcome back, ${escapeHtml(myProfile.username)}</h2>
      <p class="muted" style="margin:0;">${t.icon} ${t.title} · ${myProfile.total_xp} total XP</p>
    </div>
    <div class="card">
      <p class="muted" style="margin:0;">Head to <strong>Routines</strong> to check off today's steps and earn XP, or check the <strong>Leaderboard</strong> to see how you stack up against friends.</p>
    </div>
  `;
}

function renderAbout(){
  $('aboutView').innerHTML = `
    <div class="card">
      <h2 style="margin:0 0 10px;">About Ritual</h2>
      <p>Ritual helps you build routines that actually stick — morning, night, after school, after work, and anything else you want to turn into a habit. Check off small steps daily, earn XP, and watch your streaks and titles grow.</p>
      <p>Add friends to see how you're both doing, or check the global leaderboard to see the most consistent people using Ritual.</p>
      <p class="muted" style="margin-top:16px;">Questions or feedback? Reach us at <strong>henrik.j.santana@gmail.com</strong>.</p>
    </div>
  `;
}

let lbMode = 'global';
async function loadLeaderboard(mode){
  lbMode = mode || lbMode;
  const view = $('leaderboardView');
  view.innerHTML = '<p class="muted">Loading…</p>';

  let rows = [];
  if(lbMode === 'global'){
    const {data} = await sb.from('profiles').select('*').order('total_xp', {ascending:false}).limit(20);
    rows = data || [];
  } else {
    const {data: fr} = await sb.from('friends').select('*').eq('status','accepted')
      .or(`user_id.eq.${session.user.id},friend_id.eq.${session.user.id}`);
    const ids = new Set([session.user.id]);
    (fr||[]).forEach(f=>{ ids.add(f.user_id); ids.add(f.friend_id); });
    const {data} = await sb.from('profiles').select('*').in('user_id',[...ids]).order('total_xp',{ascending:false});
    rows = data || [];
  }

  view.innerHTML = '';
  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.style.marginBottom = '16px';
  seg.innerHTML = `<button data-m="global" class="${lbMode==='global'?'active':''}">Global</button><button data-m="friends" class="${lbMode==='friends'?'active':''}">Friends</button>`;
  seg.querySelectorAll('button').forEach(b=> b.onclick = () => loadLeaderboard(b.dataset.m));
  view.appendChild(seg);

  const card = document.createElement('div');
  card.className = 'card';
  if(rows.length===0){
    card.innerHTML = '<p class="muted">No one here yet.</p>';
  } else {
    rows.forEach((r,i)=>{
      const t = getTitleFor(r.total_xp);
      const row = document.createElement('div');
      row.className = 'lb-row';
      row.innerHTML = `<span class="lb-rank">#${i+1}</span><span class="lb-name">${t.icon} ${escapeHtml(r.username)}${r.user_id===session.user.id ? ' (you)' : ''}</span><span class="lb-xp">${r.total_xp} XP</span>`;
      card.appendChild(row);
    });
  }
  view.appendChild(card);

  if(lbMode === 'friends') await renderFriendsManager(view);
}

async function renderFriendsManager(container){
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h3 style="margin:0 0 4px;font-size:15px;">Add a friend</h3>`;
  const addRow = document.createElement('div');
  addRow.className = 'add-friend';
  addRow.innerHTML = `<input type="text" id="friendUsernameInput" placeholder="Their username"><button class="btn-primary" style="width:auto;margin:0;">Send</button>`;
  card.appendChild(addRow);
  const msg = document.createElement('div');
  msg.className = 'muted';
  msg.style.marginTop = '10px';
  card.appendChild(msg);

  addRow.querySelector('button').onclick = async () => {
    const uname = card.querySelector('#friendUsernameInput').value.trim();
    if(!uname) return;
    const {data: target} = await sb.from('profiles').select('*').ilike('username', uname).maybeSingle();
    if(!target){ msg.textContent = "No user with that username."; return; }
    if(target.user_id === session.user.id){ msg.textContent = "That's you!"; return; }
    const {error} = await sb.from('friends').insert({user_id: session.user.id, friend_id: target.user_id, status:'pending'});
    msg.textContent = error ? (error.message.toLowerCase().includes('duplicate') ? "Already sent, or already friends." : error.message) : "Friend request sent!";
  };
  container.appendChild(card);

  const {data: incoming} = await sb.from('friends').select('*').eq('friend_id', session.user.id).eq('status','pending');
  if(incoming && incoming.length){
    const reqCard = document.createElement('div');
    reqCard.className = 'card';
    reqCard.innerHTML = `<h3 style="margin:0 0 8px;font-size:15px;">Friend requests</h3>`;
    for(const req of incoming){
      const {data: sender} = await sb.from('profiles').select('username').eq('user_id', req.user_id).maybeSingle();
      const row = document.createElement('div');
      row.className = 'pending-row';
      row.innerHTML = `<span>${escapeHtml(sender?.username || 'Someone')}</span><button class="btn-link" style="margin:0;">Accept</button>`;
      row.querySelector('button').onclick = async () => {
        await sb.from('friends').update({status:'accepted'}).eq('id', req.id);
        loadLeaderboard('friends');
      };
      reqCard.appendChild(row);
    }
    container.appendChild(reqCard);
  }
}

async function loadSettings(){
  const {data} = await sb.from('user_settings').select('*').eq('user_id', session.user.id).maybeSingle();
  if(data) currentSettings = data;
  applySettings(currentSettings);
}

function applySettings(s){
  const root = document.documentElement.style;
  root.setProperty('--accent', s.accent);
  root.setProperty('--accent-dark', shade(s.accent));
  root.setProperty('--ink', s.text_color || '#3A3226');
  root.setProperty('--font-body', `'${s.font || 'Nunito'}', -apple-system, sans-serif`);
  if(s.bg_type === 'image' && s.bg_value){
    document.body.style.backgroundImage = `url("${s.bg_value}")`;
    document.body.style.backgroundColor = '';
  } else {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = s.bg_value || '#F2E9DA';
    root.setProperty('--bg', s.bg_value || '#F2E9DA');
  }
}

function shade(hex){
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,(n>>16)-30), g = Math.max(0,((n>>8)&255)-30), b = Math.max(0,(n&255)-30);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

function setupCustomizeUI(){
  $('customizeBtn').onclick = () => {
    $('customizePanel').classList.toggle('hidden');
    $('bgColorInput').value = currentSettings.bg_type==='color' ? currentSettings.bg_value : '#F2E9DA';
    $('bgImageInput').value = currentSettings.bg_type==='image' ? currentSettings.bg_value : '';
    $('accentInput').value = currentSettings.accent;
    $('textColorInput').value = currentSettings.text_color || '#3A3226';
    $('fontInput').value = currentSettings.font || 'Nunito';
    setBgTypeUI(currentSettings.bg_type);
  };
  document.querySelectorAll('#bgTypeSeg button').forEach(b=>{
    b.onclick = () => setBgTypeUI(b.dataset.type);
  });
  $('saveCustomize').onclick = async () => {
    const type = document.querySelector('#bgTypeSeg button.active').dataset.type;
    const value = type==='image' ? $('bgImageInput').value.trim() : $('bgColorInput').value;
    const accent = $('accentInput').value;
    const text_color = $('textColorInput').value;
    const font = $('fontInput').value;
    currentSettings = {user_id: session.user.id, bg_type:type, bg_value:value, accent, text_color, font};
    await sb.from('user_settings').upsert(currentSettings);
    applySettings(currentSettings);
    $('customizePanel').classList.add('hidden');
  };
}

function setBgTypeUI(type){
  document.querySelectorAll('#bgTypeSeg button').forEach(b=>b.classList.toggle('active', b.dataset.type===type));
  $('bgColorRow').classList.toggle('hidden', type!=='color');
  $('bgImageRow').classList.toggle('hidden', type!=='image');
}

async function loadRoutinesList(){
  let {data} = await sb.from('routines').select('*')
    .eq('user_id', session.user.id).is('parent_routine_id', null).order('created_at');

  if(!data || data.length===0){
    for(const cat of CATS){
      const {data: created} = await sb.from('routines').insert({
        user_id: session.user.id, category: cat.key, name: cat.label, parent_routine_id: null
      }).select().single();
      if(created){
        const rows = cat.items.map((text,i)=>({routine_id: created.id, text, position:i}));
        await sb.from('routine_items').insert(rows);
      }
    }
    const res = await sb.from('routines').select('*')
      .eq('user_id', session.user.id).is('parent_routine_id', null).order('created_at');
    data = res.data;
  }

  routinesList = data || [];
  if(!activeRoutineId || !routinesList.find(r=>r.id===activeRoutineId)){
    activeRoutineId = routinesList.length ? routinesList[0].id : null;
  }
}

function renderTabs(){
  $('tabs').innerHTML = '';
  routinesList.forEach(r=>{
    const b = document.createElement('button');
    b.className = 'tab' + (r.id===activeRoutineId ? ' active' : '');
    b.textContent = r.name;
    b.onclick = () => { activeRoutineId = r.id; renderTabs(); loadRoutine(r.id); };
    $('tabs').appendChild(b);
  });
  const addBtn = document.createElement('button');
  addBtn.className = 'tab';
  addBtn.style.borderStyle = 'dashed';
  addBtn.textContent = '+ New routine';
  addBtn.onclick = createNewRoutine;
  $('tabs').appendChild(addBtn);
}

async function createNewRoutine(){
  const name = prompt("Name your new routine (e.g. Weekend, Study, Skincare):");
  if(!name || !name.trim()) return;
  const {data: created} = await sb.from('routines').insert({
    user_id: session.user.id, category:'custom', name: name.trim(), parent_routine_id: null
  }).select().single();
  if(created){
    await sb.from('routine_items').insert({routine_id: created.id, text:"First step", position:0, xp:10});
    await loadRoutinesList();
    activeRoutineId = created.id;
    renderTabs();
    loadRoutine(activeRoutineId);
  }
}

async function loadRoutine(routineId){
  $('routineArea').innerHTML = '<p class="muted">Loading…</p>';
  const routine = routinesList.find(r=>r.id===routineId);
  if(!routine){ $('routineArea').innerHTML = '<p class="muted">No routines yet — create one above.</p>'; return; }

  const {data: subroutines} = await sb.from('routines').select('*')
    .eq('parent_routine_id', routine.id).order('created_at');

  await renderRoutine(routine, subroutines || []);
}

async function renderRoutine(routine, subroutines){
  const {data: items} = await sb.from('routine_items').select('*').eq('routine_id', routine.id).order('position');
  const today = new Date().toISOString().slice(0,10);
  const {data: comps} = await sb.from('completions').select('*')
    .eq('user_id', session.user.id).eq('routine_id', routine.id).order('completed_date', {ascending:false}).limit(60);
  const todayComp = (comps||[]).find(c=>c.completed_date===today);
  const doneIds = new Set(todayComp ? todayComp.done_item_ids : []);
  const streak = computeStreak(comps||[], (items||[]).length);

  const area = $('routineArea');
  area.innerHTML = '';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <div class="routine-header">
      <h2 style="margin:0;font-size:18px;">${escapeHtml(routine.name)}</h2>
      <span class="streak">🔥 ${streak} day${streak===1?'':'s'}</span>
    </div>
    <div style="display:flex;gap:16px;margin:2px 0 10px;">
      <button class="btn-link" id="renameRoutineBtn" style="margin:0;">Rename</button>
      <button class="btn-link" id="deleteRoutineBtn" style="margin:0;color:#A5432E;">Delete routine</button>
    </div>
  `;
  card.querySelector('#renameRoutineBtn').onclick = async () => {
    const newName = prompt("Rename this routine:", routine.name);
    if(newName && newName.trim()){
      await sb.from('routines').update({name: newName.trim()}).eq('id', routine.id);
      await loadRoutinesList();
      renderTabs();
      loadRoutine(routine.id);
    }
  };
  card.querySelector('#deleteRoutineBtn').onclick = async () => {
    if(!confirm(`Delete "${routine.name}" and everything in it (steps, sub-routines, history)? This can't be undone.`)) return;
    await sb.from('routines').delete().eq('id', routine.id);
    activeRoutineId = null;
    await loadRoutinesList();
    renderTabs();
    if(activeRoutineId) loadRoutine(activeRoutineId);
    else $('routineArea').innerHTML = '<p class="muted">No routines yet — create one above.</p>';
  };
  const list = document.createElement('div');
  (items||[]).forEach(it=>{
    const row = document.createElement('div');
    row.className = 'item-row' + (doneIds.has(it.id) ? ' done' : '');
    row.innerHTML = `<input type="checkbox" ${doneIds.has(it.id)?'checked':''}> <span>${escapeHtml(it.text)}</span> <span class="muted" style="font-size:12px;">+${it.xp||10} XP</span> <button class="rm">×</button>`;
    row.querySelector('input').onchange = async (e) => {
      const xpVal = it.xp || 10;
      if(e.target.checked){ doneIds.add(it.id); adjustXp(xpVal); } else { doneIds.delete(it.id); adjustXp(-xpVal); }
      await saveCompletion(routine.id, today, [...doneIds]);
      renderRoutine(routine, subroutines);
    };
    row.querySelector('.rm').onclick = async () => {
      await sb.from('routine_items').delete().eq('id', it.id);
      renderRoutine(routine, subroutines);
    };
    list.appendChild(row);
  });
  card.appendChild(list);

  const addRow = document.createElement('div');
  addRow.className = 'add-item';
  addRow.innerHTML = `<input type="text" placeholder="Add a step…" id="newItemInput"><input type="number" min="1" max="500" value="10" id="newItemXp" title="XP for this step"><button>Add</button>`;
  addRow.querySelector('button').onclick = async () => {
    const val = document.getElementById('newItemInput').value.trim();
    const xpVal = parseInt(document.getElementById('newItemXp').value) || 10;
    if(!val) return;
    await sb.from('routine_items').insert({routine_id: routine.id, text: val, position:(items||[]).length, xp: xpVal});
    renderRoutine(routine, subroutines);
  };
  card.appendChild(addRow);
  area.appendChild(card);

  const subCard = document.createElement('div');
  subCard.className = 'card';
  subCard.innerHTML = `<h3 style="margin:0 0 4px;font-size:15px;">Sub-routines</h3><p class="muted" style="margin-top:0;">e.g. a "Gym" checklist that lives inside this routine.</p>`;
  const subListDiv = document.createElement('div');
  subListDiv.className = 'sub-list';
  subroutines.forEach(sr=>{
    const chip = document.createElement('span');
    chip.style.display = 'inline-flex';
    chip.style.alignItems = 'center';
    chip.style.gap = '2px';
    chip.style.marginRight = '6px';
    const btn = document.createElement('button');
    btn.className = 'sub-chip';
    btn.style.border = 'none';
    btn.style.margin = '4px 0 0';
    btn.textContent = sr.name + ' →';
    btn.onclick = () => openSubroutine(sr, routine, subroutines);
    const del = document.createElement('button');
    del.textContent = '×';
    del.style.background = 'none';
    del.style.border = 'none';
    del.style.color = 'var(--soft)';
    del.style.fontSize = '16px';
    del.onclick = async () => {
      if(!confirm(`Delete sub-routine "${sr.name}"?`)) return;
      await sb.from('routines').delete().eq('id', sr.id);
      loadRoutine(routine.id);
    };
    chip.appendChild(btn);
    chip.appendChild(del);
    subListDiv.appendChild(chip);
  });
  subCard.appendChild(subListDiv);

  const newSub = document.createElement('div');
  newSub.className = 'new-sub';
  newSub.innerHTML = `<input type="text" placeholder="New sub-routine name (e.g. Gym)" id="newSubInput"><button>Create</button>`;
  newSub.querySelector('button').onclick = async () => {
    const val = document.getElementById('newSubInput').value.trim();
    if(!val) return;
    const {data: created} = await sb.from('routines').insert({
      user_id: session.user.id, category: routine.category, name: val, parent_routine_id: routine.id
    }).select().single();
    if(created){
      await sb.from('routine_items').insert({routine_id: created.id, text:"First step", position:0, xp:10});
      loadRoutine(routine.id);
    }
  };
  subCard.appendChild(newSub);
  area.appendChild(subCard);
}

async function openSubroutine(sub, parentRoutine, siblingSubs){
  const {data: items} = await sb.from('routine_items').select('*').eq('routine_id', sub.id);
  if(!items || items.length===0){
    await sb.from('routine_items').insert({routine_id: sub.id, text:"First step", position:0});
  }
  renderRoutine(sub, []);
  const back = document.createElement('button');
  back.className = 'btn-link';
  back.textContent = '← Back to ' + parentRoutine.name;
  back.onclick = () => loadRoutine(parentRoutine.id);
  $('routineArea').prepend(back);
}

async function saveCompletion(routineId, dateStr, doneIds){
  await sb.from('completions').upsert({
    user_id: session.user.id, routine_id: routineId,
    completed_date: dateStr, done_item_ids: doneIds
  }, {onConflict:'user_id,routine_id,completed_date'});
}

function computeStreak(comps, totalItems){
  if(totalItems===0) return 0;
  let streak = 0;
  let cursor = new Date();
  for(let i=0;i<365;i++){
    const dstr = cursor.toISOString().slice(0,10);
    const comp = comps.find(c=>c.completed_date===dstr);
    const complete = comp && comp.done_item_ids.length >= totalItems && totalItems>0;
    if(complete){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
</script>
