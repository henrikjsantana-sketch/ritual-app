<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ritual — Build Routines That Stick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600;700&family=Manrope:wght@500;600;700;800&family=Quicksand:wght@500;600;700&family=Nunito:wght@400;600;700&family=Poppins:wght@400;600;700&family=Comic+Neue:wght@400;700&family=Merriweather:wght@400;700&family=Sora:wght@500;600;700&family=Playfair+Display:wght@600;700&family=Work+Sans:wght@400;600;700&family=DM+Sans:wght@500;600;700&family=Lora:wght@500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --bg:#0A0A0C; --ink:#F2F0EC; --soft:#8D897F; --line:#232019;
    --accent:#E8622C; --accent-dark:#C24E20; --gold:#E3B341; --good:#34C77B;
    --card:#141215; --card-alpha:rgba(20,18,21,.82); --input-bg:#17151A;
    --font-body:'Inter',-apple-system,sans-serif;
    --font-display:'Space Grotesk',var(--font-body);
    --font-mono:'IBM Plex Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);min-height:100vh;background-size:cover;background-position:center;background-attachment:fixed;transition:background-color .3s;position:relative;}
  body::before{content:"";position:fixed;top:-12%;left:-12%;width:55%;height:55%;background:radial-gradient(circle,var(--accent) 0%,transparent 70%);opacity:.14;filter:blur(70px);z-index:-1;pointer-events:none;}
  body::after{content:"";position:fixed;bottom:-15%;right:-12%;width:55%;height:55%;background:radial-gradient(circle,#6C63FF 0%,transparent 70%);opacity:.12;filter:blur(80px);z-index:-1;pointer-events:none;}
  h1,h2,h3{font-family:var(--font-display);color:var(--ink);letter-spacing:.1px;font-weight:700;}
  .tagline{font-style:normal;}
  .wrap{max-width:880px;margin:0 auto;padding:40px 24px 80px;position:relative;z-index:1;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:16px;}
  .stat-card{background:linear-gradient(155deg,var(--card-alpha),rgba(232,98,44,.08));border:1px solid var(--line);border-radius:14px;padding:18px;}
  .stat-card .stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--soft);margin-bottom:8px;}
  .stat-card .stat-value{font-family:var(--font-mono);font-size:26px;font-weight:700;}
  .stat-card .stat-value.good{color:var(--good);}
  .stat-card .stat-value.accent{color:var(--accent);}
  .stat-card .stat-value.gold{color:var(--gold);}
  .progress-bar{background:var(--line);border-radius:6px;height:10px;overflow:hidden;margin-top:10px;}
  .progress-fill{background:var(--accent);height:100%;border-radius:6px;transition:width .3s;}
  .progress-fill.gold{background:var(--gold);}
  .tier-row{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;}
  .tier-row:last-child{border-bottom:none;}
  .tier-row.unlocked .tier-name{color:var(--gold);font-weight:700;}
  .tier-row .tier-req{color:var(--soft);font-family:var(--font-mono);font-size:13px;}
  .roadmap{display:flex;flex-direction:column;padding-left:4px;}
  .roadmap-node{display:flex;align-items:center;gap:14px;position:relative;padding:12px 0;}
  .roadmap-node:not(:last-child)::before{content:"";position:absolute;left:19px;top:52px;width:2px;height:calc(100% - 24px);background:var(--line);}
  .roadmap-node.unlocked:not(:last-child)::before{background:var(--gold);}
  .node-icon{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;background:var(--card);border:2px solid var(--line);flex-shrink:0;z-index:1;color:var(--soft);}
  .roadmap-node.unlocked .node-icon{border-color:var(--gold);background:rgba(227,179,65,.14);color:var(--gold);cursor:pointer;}
  .roadmap-node.unlocked .node-icon:hover{transform:scale(1.1);}
  .roadmap-node.selected .node-icon{box-shadow:0 0 0 3px rgba(227,179,65,.35);}
  .node-info{flex:1;}
  .node-title{font-weight:700;font-size:14px;}
  .node-req{color:var(--soft);font-size:12px;font-family:var(--font-mono);}
  h1{font-size:36px;font-weight:800;margin:0 0 4px;letter-spacing:.5px;}
  .tagline{color:var(--soft);margin:0 0 32px;font-size:15px;}
  .card{background:var(--card-alpha);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;padding:26px;margin-bottom:16px;box-shadow:0 8px 24px rgba(0,0,0,.35);}
  label{display:block;font-size:12px;color:var(--soft);margin-bottom:4px;margin-top:14px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;}
  input[type=text],input[type=email],input[type=password]{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--input-bg);color:var(--ink);font-family:inherit;}
  input[type=color]{width:48px;height:40px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff;}
  select{width:100%;padding:11px 16px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--input-bg);color:var(--ink);font-family:inherit;}
  button{cursor:pointer;font-family:inherit;}
  .btn-primary{background:var(--accent);color:#FFFFFF;border:none;border-radius:10px;padding:13px 18px;font-size:14px;font-weight:700;width:100%;margin-top:18px;text-transform:uppercase;letter-spacing:1px;}
  .btn-primary:hover{background:var(--accent-dark);}
  .btn-link{background:none;border:none;color:var(--accent);font-size:14px;padding:0;margin-top:14px;text-decoration:underline;}
  .error{color:#D9756B;font-size:14px;margin-top:10px;}
  .tabs{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px;padding-bottom:4px;}
  .tab{flex-shrink:0;padding:9px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card-alpha);font-size:13px;font-weight:600;color:var(--soft);text-transform:uppercase;letter-spacing:.6px;}
  .tab.active{background:var(--accent);color:#FFFFFF;border-color:var(--accent);}
  .routine-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .streak{background:var(--bg);color:var(--accent);font-size:13px;padding:4px 12px;border-radius:8px;font-weight:700;border:1px solid var(--line);}
  .item-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent);flex-shrink:0;border-radius:4px;}
  .item-row span{flex:1;font-size:15px;}
  .item-row.done span{color:var(--soft);text-decoration:line-through;}
  .rm{background:none;border:none;color:var(--soft);font-size:18px;}
  .add-item{display:flex;gap:8px;margin-top:12px;}
  .add-item input{flex:1;}
  .add-item button{background:var(--accent);color:#FFFFFF;border:none;border-radius:10px;padding:9px 16px;font-weight:700;}
  .sub-list{margin-top:10px;}
  .sub-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);color:var(--ink);border-radius:10px;padding:6px 14px;font-size:13px;font-weight:600;margin:4px 6px 0 0;border:1px solid var(--line);}
  .new-sub{display:flex;gap:8px;margin-top:14px;}
  .new-sub input{flex:1;}
  .new-sub button{background:var(--accent-dark);color:#FFFFFF;border:none;border-radius:10px;padding:9px 16px;font-weight:700;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;}
  .icon-btn{background:var(--card-alpha);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:16px;}
  .signout{background:none;border:none;color:var(--soft);font-size:13px;text-decoration:underline;}
  .hidden{display:none !important;}
  .muted{color:var(--soft);font-size:14px;}
  .topbar-actions{display:flex;gap:10px;align-items:center;}
  .seg{display:flex;gap:6px;margin-top:10px;}
  .seg button{flex:1;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--soft);font-weight:600;font-size:13px;}
  .seg button.active{background:var(--accent);color:#FFFFFF;border-color:var(--accent);}
  .nav-main{display:flex;gap:24px;margin-bottom:24px;border-bottom:2px solid var(--line);padding-bottom:10px;flex-wrap:wrap;}
  .nav-main button{background:none;border:none;color:var(--soft);font-weight:700;font-size:13px;padding:4px 2px;border-bottom:3px solid transparent;text-transform:uppercase;letter-spacing:1px;}
  .nav-main button.active{color:var(--accent);border-bottom-color:var(--accent);}
  .logo-wrap{display:flex;align-items:center;gap:12px;}
  .logo-mark circle{stroke:var(--accent);}
  .logo-mark path,.logo-mark text{fill:var(--accent);}
  .hamburger{background:none;border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:4px;}
  .hamburger span{display:block;width:18px;height:2px;background:var(--ink);}
  .nav-dropdown{position:relative;}
  .nav-main{position:absolute;top:calc(100% + 8px);right:0;z-index:10;flex-direction:column;gap:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:180px;box-shadow:0 12px 32px rgba(0,0,0,.5);border-bottom:1px solid var(--line);}
  .nav-main button{padding:10px 12px;border-bottom:none !important;text-align:left;width:100%;border-radius:8px;}
  .nav-main button.active{background:rgba(232,98,44,.14);}
  .nav-main button:hover{background:rgba(255,255,255,.04);}
  .lb-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .lb-row:last-child{border-bottom:none;}
  .lb-rank{font-weight:700;color:var(--soft);width:32px;}
  .lb-name{flex:1;font-weight:600;}
  .lb-xp{color:var(--accent);font-weight:700;}
  .add-friend{display:flex;gap:8px;margin-top:10px;}
  .add-friend input{flex:1;}
  .pending-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;}
  .add-item input[type=number]{width:64px;flex:none;text-align:center;}
  .add-item select{width:auto;flex:none;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
  #homeView,#routinesView,#tasksView,#statsView,#leaderboardView,#aboutView{animation:fadeInUp .35s ease;}
  .card{transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;}
  .card:hover{transform:translateY(-2px);box-shadow:0 14px 32px rgba(0,0,0,.45);border-color:rgba(232,98,44,.3);}
  button{transition:transform .12s ease,background-color .15s ease,opacity .15s ease;}
  .btn-primary:active,.add-item button:active,.new-sub button:active{transform:scale(.96);}
  .tab,.icon-btn,.hamburger{transition:transform .12s ease,background-color .15s ease,border-color .15s ease;}
  .tab:hover{border-color:var(--accent);}
  .tab:active,.icon-btn:active,.hamburger:active{transform:scale(.94);}
  @keyframes popCheck{0%{transform:scale(1);}45%{transform:scale(1.3);}100%{transform:scale(1);}}
  .item-row input[type=checkbox]:checked{animation:popCheck .28s ease;}
  .progress-fill{transition:width .5s cubic-bezier(.2,.8,.2,1);}
  #toastContainer{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:280px;}
  @keyframes toastIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateX(24px);}}
  .toast{background:linear-gradient(135deg,var(--card),rgba(232,98,44,.15));border:1px solid var(--accent);border-radius:10px;padding:14px 18px;box-shadow:0 12px 32px rgba(0,0,0,.5);font-size:14px;font-weight:600;animation:toastIn .3s ease,toastOut .3s ease 2.7s forwards;}
</style>
</head>
<body>

<script>
const SUPABASE_URL = "https://vpeigrziwpxmvszkzcrj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Cw3J1jQAidORRclfLQttrg_DtA_SfCX";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATS = [
  {key:"morning", label:"Morning", items:["Make the bed","Drink a glass of water","Stretch for 5 minutes","Eat breakfast"]},
  {key:"night", label:"Night", items:["Lay out tomorrow's clothes","No screens 30 min before bed","Brush teeth","Read a few pages"]},
  {key:"after_school", label:"After School", items:["Snack + water","Homework block","Free time"]},
  {key:"after_work", label:"After Work", items:["Change out of work clothes","10-min walk","Plan tomorrow's top task"]},
];

let session = null;
let routinesList = [];
let activeRoutineId = null;
let expandedSubs = new Set();
let signupMode = false;

const DIFFICULTY_XP = {easy:5, medium:15, hard:30};

function localDateStr(d = new Date()){
  const yyyy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  return `${yyyy}-${mm}-${dd}`;
}

const $ = id => document.getElementById(id);

$('authToggle').onclick = () => {
  signupMode = !signupMode;
  $('authTitle').textContent = signupMode ? "Sign up" : "Log in";
  $('authSubmit').textContent = signupMode ? "Sign up" : "Log in";
  $('authToggle').textContent = signupMode ? "Already have an account? Log in" : "Need an account? Sign up";
};

$('authSubmit').onclick = async () => {
  $('authError').classList.add('hidden');
  const email = $('email').value.trim();
  const password = $('password').value;
  if(!email || !password){ showAuthError("Enter an email and password."); return; }
  const fn = signupMode ? sb.auth.signUp({email, password}) : sb.auth.signInWithPassword({email, password});
  const {data, error} = await fn;
  if(error){ showAuthError(error.message); return; }
  if(signupMode && !data.session){
    showAuthError("Check your email to confirm your account, then log in.");
    return;
  }
  session = data.session;
  boot();
};

function showAuthError(msg){
  $('authError').textContent = msg;
  $('authError').classList.remove('hidden');
}

$('forgotBtn').onclick = async () => {
  const email = $('email').value.trim();
  if(!email){ showAuthError("Type your email above first, then click \"Forgot password?\" again."); return; }
  $('authError').classList.add('hidden');
  const {error} = await sb.auth.resetPasswordForEmail(email, {redirectTo: window.location.origin});
  if(error){ showAuthError(error.message); return; }
  showAuthError("Check your email for a link to reset your password.");
  $('authError').style.color = 'var(--accent-dark, #96501F)';
};

$('resetSubmit').onclick = async () => {
  $('resetError').classList.add('hidden');
  const newPass = $('newPassword').value;
  if(!newPass || newPass.length < 6){ 
    $('resetError').textContent = "Password must be at least 6 characters.";
    $('resetError').classList.remove('hidden');
    return;
  }
  const {error} = await sb.auth.updateUser({password: newPass});
  if(error){
    $('resetError').textContent = error.message;
    $('resetError').classList.remove('hidden');
    return;
  }
  const {data} = await sb.auth.getSession();
  session = data.session;
  $('resetView').classList.add('hidden');
  boot();
};

sb.auth.onAuthStateChange((event, sessionData) => {
  if(event === 'PASSWORD_RECOVERY'){
    $('authView').classList.add('hidden');
    $('appView').classList.add('hidden');
    $('resetView').classList.remove('hidden');
  } else if((event === 'SIGNED_IN' || event === 'INITIAL_SESSION') && sessionData && !session){
    session = sessionData;
    boot();
  }
});

$('signout').onclick = async () => {
  await sb.auth.signOut();
  session = null;
  myProfile = null;
  $('usernameSetup').classList.add('hidden');
  $('appView').classList.add('hidden');
  $('authView').classList.remove('hidden');
};

let currentSettings = {bg_type:'color', bg_value:'#0A0A0C', accent:'#E8622C', text_color:'#F2F0EC', font:'Inter', input_bg:'#17151A'};

const TITLES = [
  {min:0, title:"Newcomer", icon:"○"},
  {min:500, title:"Apprentice", icon:"◇"},
  {min:1500, title:"Committed", icon:"◈"},
  {min:4000, title:"Disciplined", icon:"◆"},
  {min:9000, title:"Elite", icon:"✦"},
  {min:20000, title:"Master", icon:"★"},
  {min:50000, title:"Legend", icon:"♛"},
];
function getTitleFor(xp){
  let t = TITLES[0];
  for(const x of TITLES) if(xp >= x.min) t = x;
  return t;
}
function getLevel(xp){ return Math.floor(1 + Math.sqrt(xp/25)); }
function xpForLevel(level){ return Math.round(Math.pow(Math.max(level-1,0),2) * 25); }

async function ensureProfile(){
  const {data} = await sb.from('profiles').select('*').eq('user_id', session.user.id).maybeSingle();

  $('usernameSetup').classList.remove('hidden');

    }

async function adjustXp(delta){
  if(!myProfile) return;
  const prevLevel = getLevel(myProfile.total_xp);
  const prevTier = getTitleFor(myProfile.total_xp).title;
  myProfile.total_xp = Math.max(0, myProfile.total_xp + delta);
  await sb.from('profiles').update({total_xp: myProfile.total_xp}).eq('user_id', session.user.id);
  renderProfileBadge();
  if(delta > 0){
    const newLevel = getLevel(myProfile.total_xp);
    const newTier = getTitleFor(myProfile.total_xp).title;
    if(newLevel > prevLevel) showToast(`Level up — you reached Level ${newLevel}`);
    if(newTier !== prevTier) showToast(`Tier unlocked: ${newTier}`);
  }
}

function renderStats(){
  const xp = myProfile.total_xp;
  const level = getLevel(xp);
  const thisLevelXp = xpForLevel(level);
  const nextLevelXp = xpForLevel(level+1);
  const levelSpan = Math.max(nextLevelXp - thisLevelXp, 1);
  const levelProgress = Math.min(100, Math.round(((xp - thisLevelXp) / levelSpan) * 100));

  const tier = getTitleFor(xp);
  const tierIdx = TITLES.findIndex(t=>t.title===tier.title);
  const nextTier = TITLES[tierIdx+1];
  const tierSpan = nextTier ? (nextTier.min - tier.min) : 1;
  const tierProgress = nextTier ? Math.min(100, Math.round(((xp - tier.min) / tierSpan) * 100)) : 100;

  const roadmapNodes = TITLES.map(t=>{
    const unlocked = xp >= t.min;
    const isSelected = (myProfile.icon || tier.icon) === t.icon;
    return `<div class="roadmap-node ${unlocked?'unlocked':''} ${isSelected?'selected':''}">
      <button class="node-icon" data-icon="${t.icon}" ${unlocked?'':'disabled'} title="${unlocked ? 'Use this icon' : t.title+' — locked'}">${unlocked ? t.icon : '🔒'}</button>

      </div>
    </div>`;
  }).join('');

  $('statsView').innerHTML = `
    <div class="card">
      <div class="stat-label" style="margin-bottom:0;">Level ${level}</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${levelProgress}%;"></div></div>
      <p class="muted" style="margin:8px 0 0;font-family:var(--font-mono);font-size:13px;">${xp - thisLevelXp} / ${levelSpan} XP to Level ${level+1}</p>
    </div>
    <div class="card">
      <div class="stat-label" style="margin-bottom:0;">Tier: ${escapeHtml(tier.title)}</div>
      <div class="progress-bar"><div class="progress-fill gold" style="width:${tierProgress}%;"></div></div>
      <p class="muted" style="margin:8px 0 0;font-family:var(--font-mono);font-size:13px;">${nextTier ? (nextTier.min - xp) + ' XP to ' + nextTier.title : 'Highest tier reached'}</p>

      <h3 style="margin:0 0 4px;font-size:15px;">Your path</h3>

function gcalLink(title, dateStr, timeStr){
  if(!dateStr) return null;
  const d = dateStr.replace(/-/g,'');
  let dates;
  if(timeStr){
    const [h,m] = timeStr.split(':').map(Number);
    const endH = (h+1) % 24;
    dates = `${d}T${String(h).padStart(2,'0')}${String(m).padStart(2,'0')}00/${d}T${String(endH).padStart(2,'0')}${String(m).padStart(2,'0')}00`;
  } else {
    dates = `${d}/${d}`;
  }
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(title)}&dates=${dates}`;
}

function applySettings(s){
  const root = document.documentElement.style;
  root.setProperty('--accent', s.accent);
  root.setProperty('--accent-dark', shade(s.accent));
  root.setProperty('--ink', s.text_color || '#3A3226');
  root.setProperty('--font-body', `'${s.font || 'Nunito'}', -apple-system, sans-serif`);
  if(s.bg_type === 'image' && s.bg_value){
    document.body.style.backgroundImage = `url("${s.bg_value}")`;
    document.body.style.backgroundColor = '';
  } else {
    document.body.style.backgroundImage = 'none';
    document.body.style.backgroundColor = s.bg_value || '#0A0A0C';
    root.setProperty('--bg', s.bg_value || '#0A0A0C');
  }
  root.setProperty('--input-bg', s.input_bg || '#17151A');
}

function shade(hex){
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,(n>>16)-30), g = Math.max(0,((n>>8)&255)-30), b = Math.max(0,(n&255)-30);
  return '#' + [r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');
}

    }
  };
  card.querySelector('#deleteRoutineBtn').onclick = async () => {
    if(!confirm(`Delete "${routine.name}" and everything in it (steps, sub-routines, history)? This can't be undone.`)) return;
    await sb.from('routines').delete().eq('id', routine.id);
    activeRoutineId = null;
    await loadRoutinesList();
    renderTabs();
    if(activeRoutineId) loadRoutine(activeRoutineId);
    else $('routineArea').innerHTML = '<p class="muted">No routines yet — create one above.</p>';
  };
  const list = document.createElement('div');
  (items||[]).forEach(it=>{
    const row = document.createElement('div');
    row.className = 'item-row' + (doneIds.has(it.id) ? ' done' : '');
    row.innerHTML = `<input type="checkbox" ${doneIds.has(it.id)?'checked':''}> <span>${escapeHtml(it.text)}</span> <span class="muted" style="font-size:12px;">+${it.xp||10} XP</span> <button class="rm">×</button>`;
    row.querySelector('input').onchange = async (e) => {
      const xpVal = it.xp || 10;
      if(e.target.checked){ doneIds.add(it.id); adjustXp(xpVal); } else { doneIds.delete(it.id); adjustXp(-xpVal); }
      await saveCompletion(routine.id, today, [...doneIds]);
      renderRoutine(routine, subroutines);
    };
    row.querySelector('.rm').onclick = async () => {
      await sb.from('routine_items').delete().eq('id', it.id);
      renderRoutine(routine, subroutines);
    };
    list.appendChild(row);
  });
  card.appendChild(list);

  const addRow = document.createElement('div');
  addRow.className = 'add-item';
  addRow.innerHTML = `<input type="text" placeholder="Add a step…" id="newItemInput"><select id="newItemDifficulty" title="Difficulty"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select><button>Add</button>`;
  addRow.querySelector('button').onclick = async () => {
    const val = document.getElementById('newItemInput').value.trim();
    const diff = document.getElementById('newItemDifficulty').value;
    const xpVal = DIFFICULTY_XP[diff] || 15;
    if(!val) return;
    await sb.from('routine_items').insert({routine_id: routine.id, text: val, position:(items||[]).length, xp: xpVal});
    renderRoutine(routine, subroutines);
  };
  card.appendChild(addRow);
  area.appendChild(card);

  const subCard = document.createElement('div');
  subCard.className = 'card';
  subCard.innerHTML = `<h3 style="margin:0 0 4px;font-size:15px;">Sub-routines</h3><p class="muted" style="margin-top:0;">e.g. a "Gym" checklist inside this routine — tap one to open it here.</p>`;
  const subListDiv = document.createElement('div');
  subListDiv.className = 'sub-list';
  subroutines.forEach(sr=>{
    const block = document.createElement('div');
    block.style.border = '1px solid var(--line)';
    block.style.borderRadius = '10px';
    block.style.marginTop = '10px';
    block.style.padding = '10px 12px';

    const headerRow = document.createElement('div');
    headerRow.style.display = 'flex';
    headerRow.style.justifyContent = 'space-between';
    headerRow.style.alignItems = 'center';
    headerRow.style.cursor = 'pointer';

    const label = document.createElement('strong');
    label.style.fontSize = '14px';
    const setLabel = () => { label.textContent = (expandedSubs.has(sr.id) ? '▾ ' : '▸ ') + sr.name; };
    setLabel();

    const actions = document.createElement('div');
    actions.style.display = 'flex';
    actions.style.gap = '10px';
    const renameBtn = document.createElement('button');
    renameBtn.className = 'btn-link'; renameBtn.style.margin = '0'; renameBtn.textContent = 'Rename';
    renameBtn.onclick = async (e) => {
      e.stopPropagation();
      const n = prompt("Rename sub-routine:", sr.name);
      if(n && n.trim()){ await sb.from('routines').update({name:n.trim()}).eq('id', sr.id); loadRoutine(routine.id); }
    };
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-link'; delBtn.style.margin = '0'; delBtn.style.color = '#D9756B'; delBtn.textContent = 'Delete';
    delBtn.onclick = async (e) => {
      e.stopPropagation();
      if(!confirm(`Delete "${sr.name}"?`)) return;
      await sb.from('routines').delete().eq('id', sr.id);
      loadRoutine(routine.id);
    };
    actions.appendChild(renameBtn);
    actions.appendChild(delBtn);
    headerRow.appendChild(label);
    headerRow.appendChild(actions);

    const body = document.createElement('div');
    body.style.marginTop = '10px';
    body.classList.toggle('hidden', !expandedSubs.has(sr.id));

    headerRow.onclick = () => {
      if(expandedSubs.has(sr.id)) expandedSubs.delete(sr.id);
      else { expandedSubs.add(sr.id); renderSubChecklist(sr, body); }
      body.classList.toggle('hidden');
      setLabel();
    };

    block.appendChild(headerRow);
    block.appendChild(body);
    subListDiv.appendChild(block);
    if(expandedSubs.has(sr.id)) renderSubChecklist(sr, body);
  });
  subCard.appendChild(subListDiv);

  const newSub = document.createElement('div');
  newSub.className = 'new-sub';
  newSub.innerHTML = `<input type="text" placeholder="New sub-routine name (e.g. Gym)" id="newSubInput"><button>Create</button>`;
  newSub.querySelector('button').onclick = async () => {
    const val = document.getElementById('newSubInput').value.trim();
    if(!val) return;
    const {data: created} = await sb.from('routines').insert({
      user_id: session.user.id, category: routine.category, name: val, parent_routine_id: routine.id
    }).select().single();
    if(created){
      await sb.from('routine_items').insert({routine_id: created.id, text:"First step", position:0, xp:10});
      loadRoutine(routine.id);
    }
  };
  subCard.appendChild(newSub);
  area.appendChild(subCard);
}

async function renderSubChecklist(sub, containerEl){
  const {data: items} = await sb.from('routine_items').select('*').eq('routine_id', sub.id).order('position');
  const today = localDateStr();
  const {data: comps} = await sb.from('completions').select('*')
    .eq('user_id', session.user.id).eq('routine_id', sub.id).order('completed_date', {ascending:false}).limit(60);
  const todayComp = (comps||[]).find(c=>c.completed_date===today);
  const doneIds = new Set(todayComp ? todayComp.done_item_ids : []);
  const streak = computeStreak(comps||[], (items||[]).length);

  containerEl.innerHTML = `<div class="muted" style="font-size:12px;margin-bottom:8px;font-family:var(--font-mono);">${streak} day${streak===1?'':'s'} streak</div>`;
  const list = document.createElement('div');
  (items||[]).forEach(it=>{
    const row = document.createElement('div');
    row.className = 'item-row' + (doneIds.has(it.id) ? ' done' : '');
    row.innerHTML = `<input type="checkbox" ${doneIds.has(it.id)?'checked':''}> <span>${escapeHtml(it.text)}</span> <span class="muted" style="font-size:12px;">+${it.xp||10} XP</span> <button class="rm">×</button>`;
    row.querySelector('input').onchange = async (e) => {
      const xpVal = it.xp || 10;
      if(e.target.checked){ doneIds.add(it.id); adjustXp(xpVal); } else { doneIds.delete(it.id); adjustXp(-xpVal); }
      await saveCompletion(sub.id, today, [...doneIds]);
      renderSubChecklist(sub, containerEl);
    };
    row.querySelector('.rm').onclick = async () => {
      await sb.from('routine_items').delete().eq('id', it.id);
      renderSubChecklist(sub, containerEl);
    };
    list.appendChild(row);
  });
  containerEl.appendChild(list);

  const addRow = document.createElement('div');
  addRow.className = 'add-item';
  const diffId = 'diff-' + sub.id;
  const textId = 'text-' + sub.id;
  addRow.innerHTML = `<input type="text" placeholder="Add a step…" id="${textId}"><select id="${diffId}"><option value="easy">Easy</option><option value="medium" selected>Medium</option><option value="hard">Hard</option></select><button>Add</button>`;
  addRow.querySelector('button').onclick = async () => {
    const val = document.getElementById(textId).value.trim();
    const diff = document.getElementById(diffId).value;
    if(!val) return;
    await sb.from('routine_items').insert({routine_id: sub.id, text: val, position:(items||[]).length, xp: DIFFICULTY_XP[diff] || 15});
    renderSubChecklist(sub, containerEl);
  };
  containerEl.appendChild(addRow);
}

async function saveCompletion(routineId, dateStr, doneIds){
  await sb.from('completions').upsert({
    user_id: session.user.id, routine_id: routineId,
    completed_date: dateStr, done_item_ids: doneIds
  }, {onConflict:'user_id,routine_id,completed_date'});
}

function computeStreak(comps, totalItems){
  if(totalItems===0) return 0;
  let streak = 0;
  let cursor = new Date();
  for(let i=0;i<365;i++){
    const dstr = localDateStr(cursor);
    const comp = comps.find(c=>c.completed_date===dstr);
    const complete = comp && comp.done_item_ids.length >= totalItems && totalItems>0;
    if(complete){ streak++; cursor.setDate(cursor.getDate()-1); }
    else break;
  }
  return streak;
}

function escapeHtml(s){
  const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
}
</script>
